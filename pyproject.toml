[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "opencrawler-lab"
version = "0.3.0"
description = "通用、合规、异步高并发的网站爬虫学习框架（robots.txt / 限速 / 断点续爬 / 站点自适应抽取）"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "OpenCrawlerLab Contributors" }]
keywords = ["crawler", "spider", "asyncio", "aiohttp", "robots-txt", "education", "scraping"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Framework :: AsyncIO",
  "Intended Audience :: Education",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Internet :: WWW/HTTP",
  "Topic :: Education",
]
dependencies = [
  "aiohttp>=3.9",
  "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
full = ["lxml>=5.0", "PyYAML>=6.0", "tomli>=2.0; python_version<'3.11'"]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
opencrawler = "opencrawler.cli:main"

[project.urls]
Homepage = "https://github.com/OpenCrawlerLab/opencrawler-lab"
Repository = "https://github.com/OpenCrawlerLab/opencrawler-lab"
Issues = "https://github.com/OpenCrawlerLab/opencrawler-lab/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
